## compose version key is obsolete in v2; removed to avoid warnings

services:
  uvicorn:
    build: ./apps/service
    volumes:
      - ./apps/service:/var/www/
    ports:
      - "8000:8000"
    environment:
      TZ: "Asia/Tokyo"
      AGENT_API_BASE_URL: http://agent:8001
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      agent:
        condition: service_started
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000'').read()"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4

  agent:
    build:
      context: ./apps/agent
    volumes:
      - ./apps/agent:/app
    ports:
      - "8001:8001"
    environment:
      TZ: "Asia/Tokyo"
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: ${PG_DATABASE}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  nginx:
    build: ./apps/web
    volumes:
      - ./apps/web/nginx.conf:/etc/nginx/nginx.conf
      - ./apps/web/build:/usr/share/nginx/html # Reactのビルドファイル
    ports:
      - "${NGINX_PORT:-80}:80"
    environment:
      TZ: "Asia/Tokyo"
    depends_on:
      - uvicorn
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: pgvector/pgvector:pg16
    container_name: shigachat-postgres
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE}
      TZ: "Asia/Tokyo"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  maintenance:
    build:
      context: ./scripts
      dockerfile: Dockerfile.maintenance
    env_file:
      - path: .env.maintenance
        required: false
    environment:
      TZ: "Asia/Tokyo"
      PG_HOST: postgres
      PG_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    volumes:
      - ./backup:/app/backup
    profiles:
      - tools

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
