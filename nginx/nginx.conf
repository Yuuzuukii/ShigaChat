user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ログフォーマットの定義
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Backend (uvicorn) container. Use service name for cross-container DNS.
    upstream backend {
        server uvicorn:8000;
    }

    server {
        listen 80;
        charset utf-8;
        absolute_redirect off;

        # /shigachat/ 直アクセス時の遷移先
        location = /shigachat/ {
            return 302 /shigachat/home;
        }

        # 外側プロキシが /shigachat を剥がして転送する構成にも対応
        location = / {
            return 302 /shigachat/home;
        }

        # API (prefixあり)
        location /shigachat/api/ {
            proxy_pass http://backend/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API (prefixなし: 外側で /shigachat を剥がす場合)
        location /api/ {
            proxy_pass http://backend/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # SPA (prefixあり)
        location /shigachat/ {
            alias /usr/share/nginx/html/;
            try_files $uri $uri/ /index.html;
        }

        # SPA (prefixなし: 外側で /shigachat を剥がす場合)
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
