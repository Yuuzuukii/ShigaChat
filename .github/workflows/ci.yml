##############################################################################
# ShigaChat – CI ビルド検証 (develop ブランチ)
#
# develop ブランチへの push 時に、フロントエンドのビルドが
# 正常に通るかを検証します。デプロイは行いません。
#
# ■ ビルドコマンド
#   npm run build  →  env-cmd -f .env.local react-scripts build
#
# ■ 必要な GitHub Secrets
#   REACT_APP_API_URL_LOCAL : 開発用の API URL (例: http://localhost:8000)
#
##############################################################################

name: CI Build Check (develop)

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NGINX_PORT: 80
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # .env.local を作成（develop 用の環境変数）
      - name: Create .env.local
        working-directory: web
        run: |
          cat > .env.local << 'EOF'
          REACT_APP_API_URL=http://localhost:8000
          REACT_APP_BASE_PATH=""
          EOF

      - name: Build (dev)
        working-directory: web
        run: npm run build

      - name: ✅ Build succeeded
        run: echo "フロントエンドのビルドが正常に完了しました"
