##############################################################################
# ShigaChat – CI ビルド検証 (develop ブランチ)
#
# develop ブランチへの push 時に、フロントエンドのビルドが
# 正常に通るかを検証します。デプロイは行いません。
#
# ■ ビルドコマンド
#   npm run build  →  env-cmd -f .env.local react-scripts build
#
# ■ 必要な GitHub Secrets
#   REACT_APP_API_URL_LOCAL : 開発用の API URL (例: http://localhost:8000)
#
##############################################################################

name: CI Build Check (develop)

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NGINX_PORT: 80
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # .env.local を作成（develop 用の環境変数）
      - name: Create .env.local
        working-directory: web
        run: |
          cat > .env.local << 'EOF'
          REACT_APP_API_URL=http://localhost:8000
          REACT_APP_BASE_PATH=""
          EOF

      # ① フロントエンドを先にビルド（nginx/build/ が必要なため）
      - name: Build (dev)
        working-directory: web
        run: npm run build

      # ② ビルド成果物を nginx/build/ にコピー
      - name: Copy build to nginx/build
        run: |
          mkdir -p nginx/build
          cp -r web/build/. nginx/build/

      # バックエンド用 .env を作成（Docker Compose 用）
      - name: Create .env (backend)
        run: |
          cat > .env << 'EOF'
          PG_HOST=postgres
          PG_PORT=5432
          PG_DATABASE=shigachat
          PG_USER=postgres
          PG_PASSWORD=postgres
          OPENAI_API_KEY=dummy
          SECRET_KEY=dummy
          EOF

      - name: Create agent/.env
        run: |
          mkdir -p agent
          cat > agent/.env << 'EOF'
          OPENAI_API_KEY=dummy
          ANSWER_MODEL=gpt-5.4-nano
          QUERY_REWRITE_MODEL=gpt-5.4-nano
          REF_SELECTION_MODEL=gpt-5.4-nano
          PG_HOST=postgres
          PG_PORT=5432
          PG_DATABASE=shigachat
          PG_USER=postgres
          PG_PASSWORD=postgres
          EOF

      # ③ nginx/build/ が揃った状態で Docker ビルド
      - name: Docker Compose up
        run: docker compose up -d --build

      - name: ✅ Build succeeded
        run: echo "フロントエンドのビルド・Docker起動が正常に完了しました"
