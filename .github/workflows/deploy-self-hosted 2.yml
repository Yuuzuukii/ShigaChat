##############################################################################
# ShigaChat – セルフホステッドランナー方式デプロイ
#
# ■ いつ使う？
#   デプロイ先サーバーが NAT / VPN / ファイアウォールの内側にあり、
#   GitHub からの直接 SSH 接続ができない場合に使います。
#
# ■ 仕組み
#   デプロイ先サーバー（またはそのネットワーク内のマシン）に
#   GitHub Actions セルフホステッドランナーをインストールし、
#   そのランナー上でビルド & デプロイを実行します。
#
# ■ セットアップ手順
#   1. GitHub リポジトリ > Settings > Actions > Runners > "New self-hosted runner"
#   2. 表示されるコマンドをデプロイ先サーバーで実行してランナーを登録
#   3. ランナーをサービスとして起動:
#        sudo ./svc.sh install
#        sudo ./svc.sh start
#   4. 以下の Secrets を登録:
#        ENV_FILE           : 本番用 .env ファイルの中身
#        REACT_APP_API_URL  : フロントエンド API URL
#
# ■ 注意
#   - runs-on に self-hosted ラベルを指定しています
#   - ランナーには Docker, Docker Compose, Node.js が必要です
##############################################################################

name: Deploy (Self-Hosted Runner)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DEPLOY_PATH: /var/services/masuo/ShigaChat_latest

jobs:
  deploy:
    runs-on: [self-hosted, linux]   # セルフホステッドランナーで実行
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # フロントエンドビルド
      # ---------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Create .env.deploy
        working-directory: web
        run: |
          echo "REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}" > .env.deploy

      - name: Build frontend
        working-directory: web
        run: npm run build:deploy

      # ---------------------------------------------------------------
      # デプロイ
      # ---------------------------------------------------------------
      - name: Copy files to deploy path
        run: |
          sudo mkdir -p ${{ env.DEPLOY_PATH }}
          sudo rsync -av --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            ./ ${{ env.DEPLOY_PATH }}/

      - name: Copy frontend build to nginx
        run: |
          sudo mkdir -p ${{ env.DEPLOY_PATH }}/nginx/build
          sudo cp -r web/build/* ${{ env.DEPLOY_PATH }}/nginx/build/

      - name: Create .env file
        run: |
          sudo bash -c "cat <<'EOF' > ${{ env.DEPLOY_PATH }}/.env
          ${{ secrets.ENV_FILE }}
          EOF"

      - name: Docker Compose up
        working-directory: ${{ env.DEPLOY_PATH }}
        run: |
          sudo docker compose pull
          sudo docker compose build --no-cache
          sudo docker compose up -d
          sudo docker compose ps

      - name: Health check
        run: |
          echo "Waiting for services to start..."
          sleep 15
          curl -f http://localhost:80 || echo "WARNING: Nginx health check failed"
          curl -f http://localhost:8000 || echo "WARNING: API health check failed"
